name: OIDC Lab

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inspect-identity:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el token OIDC e intercambiarlo por credenciales temporales de AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::481116707392:role/GitHubActionsOIDCLab
          aws-region: us-east-1

      # 2. Comprobar la identidad asumida en AWS
      - name: Verify AWS identity
        run: aws sts get-caller-identity
