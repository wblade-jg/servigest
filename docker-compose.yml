services:
  db:
    image: postgres:16-alpine
    # Entorno local de demostración: fsync desactivado para acelerar migraciones,
    # seeds y pruebas (no usar en producción).
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_USER: servigest
      POSTGRES_PASSWORD: servigest
      POSTGRES_DB: servigest
    volumes:
      - datos-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servigest"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://servigest:servigest@db:5432/servigest
      UPLOAD_DIR: /uploads
    volumes:
      - ./uploads:/uploads
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  datos-db:
